[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reveriee"
version = "0.5.0"
description = "Turn your idea into a published Python package: create the project files, then check them before you upload."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hari Prasath S" }]
keywords = ["package", "starter", "scaffold", "pypi", "beginner", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/stonefrozen096-collab/reverie"
Source = "https://github.com/stonefrozen096-collab/reverie"
Issues = "https://github.com/stonefrozen096-collab/reverie/issues"

[project.scripts]
reverie = "reverie.cli:main"

[tool.setuptools]
packages = ["reverie"]
